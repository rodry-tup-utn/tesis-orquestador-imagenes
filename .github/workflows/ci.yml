name: CI - Integración Continua Tesis Middleware

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests-and-security:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hospital_secure_password
          POSTGRES_DB: hospital_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del servidor y de prueba
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pytest-cov pytest-anyio httpx bandit pip-audit

      - name: Auditoría de Seguridad Estática (Bandit)
        run: |
          bandit -r server/app -ll -x server/tests

      - name: Auditoría de Vulnerabilidades de Dependencias (pip-audit)
        run: |
          pip-audit

      - name: Ejecutar Suite de Tests Unitarios y de Integración con Cobertura
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hospital_secure_password
          POSTGRES_DB: hospital_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5434"
          SECRET_KEY: supersecretjwtkeyforhospitalenvironment2026-ci-only!
          PSEUDONYM_SECRET: supersecretpseudonymkeyforhospitalenvironment2026-ci-only!
          ALERT_WEBHOOK_KEY: supersecretalertwebhookkeyforhospital2026!
          AUTH_PASSWORD: supersecretauthpasswordforci2026!
        run: |
          cd server
          pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing --durations=10

      - name: Subir artefacto de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage.xml

  contract-and-regression:
    name: Pruebas de Contrato y Regresión de Triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pytest-anyio pydantic

      - name: Ejecutar Regresión de Motor de Triage (Suite Ampliada N=50)
        run: |
          cd server
          pytest tests/test_triage_engine.py -v

      - name: Ejecutar Pruebas de Contrato (Normalizadores - Catálogo - Backend)
        run: |
          cd server
          pytest tests/test_contract.py -v

      - name: Ejecutar Verificación de Equivalencia DICOM Modality Worklist
        run: |
          cd server
          pytest tests/test_dicom_mwl_equivalence.py -v
