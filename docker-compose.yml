services:
  # 1. Base de Datos Relacional para tu FastAPI
  postgres:
    image: postgres:15-alpine
    container_name: db_hospital
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 2. Orquestador n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.8
    container_name: orquestador_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://host.docker.internal:5678/
      - GENERIC_TIMEZONE=America/Argentina/Mendoza
      # Los flujos leen INTERNAL_API_KEY, ALERT_WEBHOOK_KEY y TELEGRAM_CHAT_ID con $env.
      # Las versiones recientes de n8n bloquean ese acceso por defecto.
      # Para un piloto conviene migrarlas a credenciales de n8n.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALERT_WEBHOOK_KEY=${ALERT_WEBHOOK_KEY}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

  # 3. Servidor simulado para las APIs de la clínica
  mock-server:
    image: python:3.9-alpine
    container_name: mock_apis
    volumes:
      - ./mocks:/mocks
    working_dir: /mocks
    command: python -m http.server 4000
    ports:
      - "4000:4000"
  orthanc:
    image: orthancteam/orthanc:1.13.0
    container_name: servidor_dicom
    ports:
      - "4242:4242" # Puerto DICOM estándar (para que los equipos se conecten)
      - "8042:8042" # Puerto HTTP/REST API (para el tablero web y n8n)
    environment:
      - ORTHANC_NAME=Hospital_Orthanc
      - ORTHANC__AUTHENTICATION_ENABLED=true
      - ORTHANC__REGISTERED_USERS={"${ORTHANC_USER}":"${ORTHANC_PASS}"}
      - ORTHANC__WORKLISTS__ENABLE=true
      - ORTHANC__WORKLISTS__DIRECTORY=/var/lib/orthanc/worklists
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - orthanc_worklists:/var/lib/orthanc/worklists
    restart: always

  backend:
    build: ./server
    container_name: fastapi_radiogroup
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - orthanc_worklists:/worklists
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PORT: 5432
      URL_WEBHOOK_N8N: ${URL_WEBHOOK_N8N}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:?Defina ORTHANC_USER en .env}
      ORTHANC_PASSWORD: ${ORTHANC_PASS:?Defina ORTHANC_PASS en .env}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_dev
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  n8n_data:
  orthanc_data:
  orthanc_worklists:
